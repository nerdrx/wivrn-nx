<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">WiVRn NX</title>
  <desc id="desc">A violet, pointy-top crystal hexagon surrounding a white W-shaped headset visor, with a small cyan connection light.</desc>
  <defs>
    <linearGradient id="crystal" x1="32" y1="26" x2="142" y2="153" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bc8cff"/>
      <stop offset=".4" stop-color="#7700ff"/>
      <stop offset="1" stop-color="#390087"/>
    </linearGradient>
    <linearGradient id="well" x1="54" y1="37" x2="124" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33145c"/>
      <stop offset=".55" stop-color="#160927"/>
      <stop offset="1" stop-color="#260c47"/>
    </linearGradient>
    <linearGradient id="visor" x1="55" y1="62" x2="119" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7c6ff"/>
    </linearGradient>
  </defs>
  <!-- Pointy-top crystal master. Broad planes remain readable without filters. -->
  <path d="M90 8 161 49v82l-71 41-71-41V49Z" fill="url(#crystal)"/>
  <path d="m90 8 0 17-57 33-14-9Z" fill="#d9b9ff" fill-opacity=".6"/>
  <path d="m90 8 71 41-14 9-57-33Z" fill="#9a42ff"/>
  <path d="m161 49 0 82-14-8V58Z" fill="#7700ff"/>
  <path d="m161 131-71 41v-17l57-32Z" fill="#4900ac"/>
  <path d="m90 172-71-41 14-8 57 32Z" fill="#6200d9"/>
  <path d="m19 131 0-82 14 9v65Z" fill="#8e28ff"/>
  <path d="m90 25 57 33v65l-57 33-57-33V58Z" fill="url(#well)" stroke="#bd8dff" stroke-opacity=".48" stroke-width="1.5"/>
  <path d="m34 59 56-32 56 32-56-15Z" fill="#bc82ff" fill-opacity=".08"/>
  <path d="m34 121 56 33 56-33-56 15Z" fill="#7700ff" fill-opacity=".15"/>
  <!-- One continuous visor silhouette: twin lenses form the WiVRn W. -->
  <g transform="translate(0 4)">
  <path d="M46 74 56 59h68l10 15-18 40h-10L90 97l-16 17H64Z" fill="url(#visor)"/>
  <path d="m59 74 11 24 20-21 20 21 11-24-4-5H63Z" fill="#1c0b32"/>
  <!-- A restrained link indicator; cyan never competes with the violet shell. -->
  <path d="M112 62h8" stroke="#7cebe0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M90 11 22 50" fill="none" stroke="#ead6ff" stroke-opacity=".5" stroke-width="1.3"/>
</svg>
